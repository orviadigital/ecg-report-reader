name: Keep ECG App Awake

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Touch Streamlit app
        run: |
          curl \
            --silent \
            --show-error \
            --max-time 30 \
            --max-redirs 3 \
            -A "Mozilla/5.0" \
            "https://ecg-report-reader-fdbohvtyyhroskc4zvdsqz.streamlit.app/" \
            -o /dev/null || true

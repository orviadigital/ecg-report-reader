name: Keep ECG App Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Streamlit app
        run: |
          curl -L --fail --silent \
          "https://ecg-report-reader-fdbohvtyyhroskc4zvdsqz.streamlit.app/" \
          > /dev/null